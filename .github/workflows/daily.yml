name: 每日更新

on:
  schedule:
    # UTC 22:00，周一到周五 = 北京时间周二到周六早上 6:00，美股收盘之后
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # 允许在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成页面
        run: python build.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "没有新数据，不提交。"
          else
            git commit -m "数据更新 $(python -c 'import json;print(json.load(open("docs/data.json"))["asof"])')"
            git push
          fi
